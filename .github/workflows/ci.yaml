name: CI


on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main


jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install depedencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: rn tests
        run: |
          python -m pytest -v
